{% extends "base.html" %}

{% block title %}Log in | CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="h3 fw-bold mb-1">Welcome back</h2>
                <p class="text-muted mb-4">Log in to your CampusConnect account.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
            </div>
            <div class="card-footer bg-transparent text-center py-3">
                No account? <a href="{% url 'signup' %}">Sign up</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
