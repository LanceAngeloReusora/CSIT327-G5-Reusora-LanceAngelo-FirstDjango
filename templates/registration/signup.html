{% extends "base.html" %}

{% block title %}Sign up | CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="h3 fw-bold mb-1">Create your account</h2>
                <p class="text-muted mb-4">Join CampusConnect in a minute.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <button type="submit" class="btn btn-primary w-100">Sign up</button>
                </form>
            </div>
            <div class="card-footer bg-transparent text-center py-3">
                Already registered? <a href="{% url 'login' %}">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
